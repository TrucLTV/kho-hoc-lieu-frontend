<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hệ thống Đưa Bài Tập Trực Tiếp</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue-bright:#2c7be5;--blue-pale:#dbeafe;--blue-frost:#eff6ff;
  --text-dark:#071e3d;--text-muted:#718096;--danger:#ef4444;
}
body { font-family: 'Be Vietnam Pro', sans-serif; background: #f8f9fa; padding: 20px; }

/* KHU VỰC DÁN ẢNH ĐỂ TẠO BÀI TẬP */
.create-exercise-container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.paste-area {
  width: 100%;
  min-height: 200px;
  border: 3px dashed var(--blue-pale);
  background: var(--blue-frost);
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  outline: none;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
}

.paste-area:focus {
  border-color: var(--blue-bright);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(44, 123, 229, 0.1);
}

.exercise-display {
  width: 100%;
  margin-top: 20px;
  display: none;
}

#pasted-exercise-img {
  width: 100%;
  border-radius: 10px;
  border: 1px solid #eee;
}

.instruction {
  text-align: center;
  color: var(--text-muted);
}

.instruction b { color: var(--blue-bright); }

.btn-reset {
  background: var(--danger);
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="create-exercise-container">
  <h2 style="color: var(--text-dark);">📌 Đưa bài tập lên hệ thống</h2>
  <p style="color: var(--text-muted); font-size: 0.9rem;">Sử dụng tính năng dán ảnh để hiển thị đề bài nhanh chóng</p>

  <div class="paste-area" id="pasteArea" tabindex="0">
    <div id="prompt">
      <div style="font-size: 3rem;">🖼️</div>
      <p class="instruction">Click vào đây rồi nhấn <b>Ctrl + V</b> để đưa ảnh bài tập lên</p>
    </div>
    
    <div id="displayZone" class="exercise-display">
      <p style="font-weight: 600; margin-bottom: 10px;">Nội dung bài tập hiện tại:</p>
      <img id="pasted-exercise-img" src="">
      <div style="text-align: right;">
        <button class="btn-reset" onclick="resetExercise(event)">Xóa bài tập này</button>
      </div>
    </div>
  </div>
</div>

<script>
const pasteArea = document.getElementById('pasteArea');
const prompt = document.getElementById('prompt');
const displayZone = document.getElementById('displayZone');
const exerciseImg = document.getElementById('pasted-exercise-img');

// Lắng nghe sự kiện dán
pasteArea.addEventListener('paste', function(e) {
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  
  for (let item of items) {
    if (item.kind === 'file' && item.type.indexOf('image') !== -1) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      
      reader.onload = function(event) {
        // Hiển thị ảnh bài tập ngay lập tức
        exerciseImg.src = event.target.result;
        displayZone.style.display = 'block';
        prompt.style.display = 'none';
        pasteArea.style.borderStyle = 'solid'; // Đổi viền sang nét liền khi đã có nội dung
      };
      
      reader.readAsDataURL(blob);
    }
  }
});

// Hàm xóa để đưa bài mới lên
function resetExercise(e) {
  e.stopPropagation();
  exerciseImg.src = '';
  displayZone.style.display = 'none';
  prompt.style.display = 'flex';
  pasteArea.style.borderStyle = 'dashed';
  pasteArea.focus();
}

// Giúp người dùng click vào là focus ngay để dán
pasteArea.addEventListener('click', () => {
  pasteArea.focus();
});
</script>

</body>
</html>
