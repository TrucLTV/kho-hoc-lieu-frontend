<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kho Học Liệu - Đã thêm tính năng dán ảnh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ... (Giữ nguyên các biến root và style cũ của bạn) ... */
:root{
  --blue-deep:#071e3d;--blue-bright:#2c7be5;--blue-pale:#dbeafe;--blue-frost:#eff6ff;
  --text-muted:#718096;--danger:#ef4444;
}
body { font-family: 'Be Vietnam Pro', sans-serif; background: #f0f5ff; }

/* CHỈNH SỬA KHU VỰC UPLOAD ĐỂ DÁN ĐƯỢC ẢNH */
.upload-zone {
  border: 2px dashed var(--blue-pale);
  background: var(--blue-frost);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  position: relative;
  cursor: pointer;
  transition: all 0.3s;
  outline: none; /* Quan trọng để nhận diện khi click vào */
}

/* Khi nhấn vào khung sẽ có viền đậm để biết là đang sẵn sàng dán */
.upload-zone:focus-within {
  border-color: var(--blue-bright);
  background: #fff;
}

#img-preview {
  max-width: 100%;
  max-height: 250px;
  display: none;
  margin: 10px auto;
  border-radius: 8px;
  border: 1px solid var(--blue-pale);
}

.btn-remove {
  display: none;
  background: var(--danger);
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  margin: 5px auto;
}
</style>
</head>
<body>

<div style="max-width: 500px; margin: 50px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
  <h2 style="margin-bottom: 20px;">Nộp bài tập</h2>
  
  <div class="fg">
    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Hình ảnh bài tập:</label>
    
    <div class="upload-zone" id="drop-area">
      <img id="img-preview" src="">
      <button type="button" id="remove-btn" class="btn-remove" onclick="resetUpload(event)">Xóa ảnh</button>
      
      <div id="upload-prompt">
        <span style="font-size: 2rem;">📋</span>
        <p>Nhấp vào đây rồi nhấn <b>Ctrl + V</b> để dán ảnh</p>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Hoặc chọn file từ máy tính</p>
      </div>

      <input type="file" id="fileInput" accept="image/*" style="position:absolute; inset:0; opacity:0; cursor:pointer;">
    </div>
  </div>

  <button id="btnSubmit" style="width: 100%; margin-top: 20px; padding: 12px; background: var(--blue-bright); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
    🚀 Nộp bài
  </button>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const imgPreview = document.getElementById('img-preview');
const uploadPrompt = document.getElementById('upload-prompt');
const removeBtn = document.getElementById('remove-btn');
let fileToUpload = null;

// 1. Xử lý khi chọn file bằng cách nhấn vào khung
fileInput.addEventListener('change', function() {
  if (this.files && this.files[0]) {
    handleFile(this.files[0]);
  }
});

// 2. Xử lý khi DÁN (PASTE) ảnh
document.addEventListener('paste', function (e) {
  // Chỉ dán khi người dùng đang focus vào vùng upload
  if (document.activeElement.id === 'drop-area' || document.activeElement === fileInput) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let item of items) {
      if (item.kind === 'file' && item.type.indexOf('image') !== -1) {
        const blob = item.getAsFile();
        handleFile(blob);
      }
    }
  }
});

function handleFile(file) {
  fileToUpload = file;
  const reader = new FileReader();
  reader.onload = function(e) {
    imgPreview.src = e.target.result;
    imgPreview.style.display = 'block';
    removeBtn.style.display = 'block';
    uploadPrompt.style.display = 'none';
  }
  reader.readAsDataURL(file);
}

function resetUpload(e) {
  e.stopPropagation();
  fileToUpload = null;
  fileInput.value = '';
  imgPreview.src = '';
  imgPreview.style.display = 'none';
  removeBtn.style.display = 'none';
  uploadPrompt.style.display = 'block';
}

// 3. Xử lý nút nộp bài
document.getElementById('btnSubmit').onclick = function() {
  if (!fileToUpload) {
    alert("Vui lòng dán hoặc chọn ảnh trước!");
    return;
  }
  alert("Đã nhận file: " + (fileToUpload.name || "Pasted_Image.png") + "\nSẵn sàng gửi lên server!");
};
</script>

</body>
</html>
