<style>
/* Thêm CSS này để hỗ trợ vùng dán ảnh trong Modal */
.upload-zone {
    position: relative;
    border: 2.5px dashed var(--blue-pale);
    border-radius: 12px;
    padding: 22px 16px;
    text-align: center;
    background: var(--blue-frost);
    outline: none;
    transition: all 0.2s;
}
.upload-zone:focus {
    border-color: var(--blue-bright);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(44, 123, 229, 0.1);
}
.paste-preview-container {
    display: none;
    margin-top: 10px;
}
#paste-img-render {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    border: 1px solid var(--blue-pale);
}
</style>

<div class="fg">
  <label class="fl">Nội dung bài tập (Dán ảnh trực tiếp hoặc chọn file)</label>
  <div class="upload-zone" id="exercisePasteZone" tabindex="0">
    <div id="paste-msg">
      <span class="plus">📋</span>
      <p style="font-size: 0.85rem;">Nhấp vào đây rồi nhấn <b>Ctrl + V</b> để dán ảnh bài tập</p>
      <p style="font-size: 0.7rem; color: var(--text-muted);">Hoặc kéo thả file vào đây</p>
    </div>
    
    <div id="pastePreview" class="paste-preview-container">
      <img id="paste-img-render" src="">
      <button type="button" onclick="clearExercisePaste(event)" style="display:block; margin: 8px auto; padding: 4px 12px; background: var(--danger); color:white; border:none; border-radius:6px; cursor:pointer; font-size:0.75rem;">Xóa ảnh này</button>
    </div>

    <input type="file" id="exerciseFileInput" accept="image/*" style="position:absolute; inset:0; opacity:0; cursor:pointer;" onchange="handleExFileSelect(this)">
  </div>
</div>

<script>
// Biến lưu trữ file bài tập hiện tại (dù dán hay chọn file)
let currentExerciseFile = null;

const exPasteZone = document.getElementById('exercisePasteZone');

// Xử lý sự kiện DÁN (Ctrl + V)
exPasteZone.addEventListener('paste', function(e) {
    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (let item of items) {
        if (item.kind === 'file' && item.type.indexOf('image') !== -1) {
            const blob = item.getAsFile();
            displayExerciseImage(blob);
        }
    }
});

// Xử lý khi chọn file truyền thống
function handleExFileSelect(input) {
    if (input.files && input.files[0]) {
        displayExerciseImage(input.files[0]);
    }
}

// Hàm hiển thị bản xem trước
function displayExerciseImage(file) {
    currentExerciseFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById('paste-img-render').src = e.target.result;
        document.getElementById('pastePreview').style.display = 'block';
        document.getElementById('paste-msg').style.display = 'none';
        document.getElementById('exercisePasteZone').style.borderStyle = 'solid';
    };
    reader.readAsDataURL(file);
}

// Hàm xóa ảnh đã dán/chọn
function clearExercisePaste(e) {
    if (e) e.stopPropagation();
    currentExerciseFile = null;
    document.getElementById('exerciseFileInput').value = '';
    document.getElementById('paste-img-render').src = '';
    document.getElementById('pastePreview').style.display = 'none';
    document.getElementById('paste-msg').style.display = 'block';
    document.getElementById('exercisePasteZone').style.borderStyle = 'dashed';
}

// Cập nhật hàm Lưu bài tập (Submit) của bạn
async function saveExercise() {
    // Khi gửi dữ liệu, bạn sử dụng 'currentExerciseFile' 
    // thay vì lấy trực tiếp từ input.files[0]
    if (!currentExerciseFile) {
        alert("Vui lòng đưa hình ảnh bài tập lên!");
        return;
    }
    
    // Logic fetch/POST dữ liệu của bạn...
    console.log("Đang nộp file bài tập:", currentExerciseFile);
}
</script>
